<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" width="100%" height="100%">
  <defs>
    <radialGradient id="bgH" cx="20%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyanH" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="920" height="220" rx="36" fill="url(#bgH)" stroke="url(#goldH)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Left: Stylized Interlocking NL Monogram -->
  <g transform="translate(40, 20)">
    <!-- Lattice circle & crosshairs -->
    <circle cx="90" cy="90" r="70" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,5" opacity="0.25"/>
    <polygon points="90,20 160,90 90,160 20,90" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.2"/>

    <!-- Atoms -->
    <circle cx="45" cy="45" r="5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="45" cy="135" r="5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="115" cy="45" r="5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="115" cy="135" r="5" fill="#38bdf8" opacity="0.8"/>
    <circle cx="165" cy="135" r="5" fill="#38bdf8" opacity="0.8"/>

    <!-- NL Monogram Path -->
    <g filter="url(#glowH)">
      <!-- Base Gold Stroke -->
      <path d="M 45 135 L 45 45 L 115 135 L 115 45 M 115 135 L 165 135" 
            fill="none" 
            stroke="url(#goldH)" 
            stroke-width="16" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <!-- Cyan Accent -->
      <path d="M 45 45 L 115 135 L 165 135" 
            fill="none" 
            stroke="url(#cyanH)" 
            stroke-width="5" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            opacity="0.9" />
    </g>
  </g>

  <!-- Right: Typography Wordmark & Entity -->
  <g transform="translate(260, 48)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
    <text x="65" y="16" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#f59e0b">
      FCC · a=4.078 Å
    </text>

    <!-- Main Title -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="4" fill="#ffffff">
      NOVUS<tspan fill="#f59e0b">LATTICE</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="500" letter-spacing="1.5" fill="#94a3b8">
      Multiscale Continuum Mechanics &amp; Real-Time Thermal Radar
    </text>

    <!-- Author & Entity Attribution -->
    <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#e2e8f0">
      Author: <tspan fill="#38bdf8">Mikel Irastorza</tspan> · Entity: <tspan fill="#fbbf24">Novo Mundus</tspan> (Spain)
    </text>
  </g>
</svg>
